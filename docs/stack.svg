<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>ArgonTwin tech stack and status as of Oct 25, 2026</title>
  <rect width="1200" height="760" fill="#0b0c0e"/>

  <text x="40" y="58" font-size="30" font-weight="800" fill="#e3b341">The stack</text>
  <text x="40" y="86" font-size="15" fill="#9a968c">Each layer, what runs it, and where it stands. Status as of Oct 25, 2026.</text>

  <!-- legend -->
  <g font-size="14" fill="#edeae2">
    <circle cx="800" cy="52" r="6" fill="#7fd1a8"/><text x="814" y="57">Verified today</text>
    <circle cx="940" cy="52" r="6" fill="#e3b341"/><text x="954" y="57">In progress</text>
    <circle cx="1060" cy="52" r="6" fill="none" stroke="#9a968c" stroke-width="2"/><text x="1074" y="57">Planned</text>
  </g>

  <!-- layer bands: label column 40..220, chips from 240 -->
  <g font-size="13">
    <!-- 1 Capture -->
    <rect x="30" y="112" width="1140" height="88" rx="10" fill="#15171b" stroke="#2c3036"/>
    <text x="52" y="148" font-size="18" font-weight="700" fill="#edeae2">Capture</text>
    <text x="52" y="170" fill="#9a968c">phone to 3D desk</text>
    <g transform="translate(240,128)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">iPhone 17 Pro Max video</text>
      <text x="32" y="44" fill="#9a968c">10.4 s, 0.5x ultra wide, 1080p60</text>
    </g>
    <g transform="translate(546,128)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#e3b341"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">COLMAP on a Colab T4</text>
      <text x="32" y="44" fill="#9a968c">52 views registered</text>
    </g>
    <g transform="translate(852,128)">
      <rect width="300" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#e3b341"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">gsplat Gaussian splat</text>
      <text x="32" y="44" fill="#9a968c">not exported yet, plain table for now</text>
    </g>

    <!-- 2 Reasoning -->
    <rect x="30" y="212" width="1140" height="88" rx="10" fill="#15171b" stroke="#2c3036"/>
    <text x="52" y="248" font-size="18" font-weight="700" fill="#edeae2">Reasoning</text>
    <text x="52" y="270" fill="#9a968c">models that see and fix</text>
    <g transform="translate(240,228)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#e3b341">gemini-4-argon</text>
      <text x="32" y="44" fill="#9a968c">Interactions API, direct call verified</text>
    </g>
    <g transform="translate(546,228)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#e3b341"/>
      <text x="32" y="25" font-weight="700" fill="#e3b341">antigravity-preview-09-2026</text>
      <text x="32" y="44" fill="#9a968c">managed agent, world build, sweep</text>
    </g>
    <g transform="translate(852,228)">
      <rect width="300" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Gemma 4 E4B via Ollama</text>
      <text x="32" y="44" fill="#9a968c">base: 8/12 MuJoCo passes, fine tune running</text>
    </g>

    <!-- 3 Physics -->
    <rect x="30" y="312" width="1140" height="88" rx="10" fill="#15171b" stroke="#2c3036"/>
    <text x="52" y="348" font-size="18" font-weight="700" fill="#edeae2">Physics</text>
    <text x="52" y="370" fill="#9a968c">the referee</text>
    <g transform="translate(240,328)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">MuJoCo 3.17</text>
      <text x="32" y="44" fill="#9a968c">handwritten plan passes, weld assist</text>
    </g>
    <g transform="translate(546,328)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Two ALOHA arms + mink 1.3</text>
      <text x="32" y="44" fill="#9a968c">Menagerie model, differential IK</text>
    </g>
    <g transform="translate(852,328)">
      <rect width="300" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">pytest: 3 physics tests pass</text>
      <text x="32" y="44" fill="#9a968c">repeatable, must fail, reaches target</text>
    </g>

    <!-- 4 Contracts -->
    <rect x="30" y="412" width="1140" height="88" rx="10" fill="#15171b" stroke="#2c3036"/>
    <text x="52" y="448" font-size="18" font-weight="700" fill="#edeae2">Contracts</text>
    <text x="52" y="470" fill="#9a968c">who decides what</text>
    <g transform="translate(240,428)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Pydantic schemas 1.0.0</text>
      <text x="32" y="44" fill="#9a968c">frozen interfaces for sim and Argon</text>
    </g>
    <g transform="translate(546,428)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">judge(): pass or fail</text>
      <text x="32" y="44" fill="#9a968c">measured metrics, fixed thresholds</text>
    </g>
    <g transform="translate(852,428)">
      <rect width="300" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#e3b341"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">loop.py</text>
      <text x="32" y="44" fill="#9a968c">tested with stubs, live run next</text>
    </g>

    <!-- 5 Show -->
    <rect x="30" y="512" width="1140" height="88" rx="10" fill="#15171b" stroke="#2c3036"/>
    <text x="52" y="548" font-size="18" font-weight="700" fill="#edeae2">Show</text>
    <text x="52" y="570" fill="#9a968c">what judges see</text>
    <g transform="translate(240,528)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">FastAPI + uvicorn</text>
      <text x="32" y="44" fill="#9a968c">live backend on localhost:8000</text>
    </g>
    <g transform="translate(546,528)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Three.js 0.170 viewer</text>
      <text x="32" y="44" fill="#9a968c">real ALOHA meshes, 12 STL files</text>
    </g>
    <g transform="translate(852,528)">
      <rect width="300" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#e3b341"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Gold scan / Photoreal toggle</text>
      <text x="32" y="44" fill="#9a968c">gaussian-splats-3d 0.4.7, needs the splat</text>
    </g>

    <!-- 6 Host and secrets -->
    <rect x="30" y="612" width="1140" height="88" rx="10" fill="#15171b" stroke="#2c3036"/>
    <text x="52" y="648" font-size="18" font-weight="700" fill="#edeae2">Host</text>
    <text x="52" y="670" fill="#9a968c">public and private</text>
    <g transform="translate(240,628)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Vercel target preview</text>
      <text x="32" y="44" fill="#9a968c">argon-twin.vercel.app, concept only</text>
    </g>
    <g transform="translate(546,628)">
      <rect width="290" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="none" stroke="#9a968c" stroke-width="2"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">Vercel recorded replay</text>
      <text x="32" y="44" fill="#9a968c">export_replay.py, after the loop runs</text>
    </g>
    <g transform="translate(852,628)">
      <rect width="300" height="56" rx="8" fill="#1d2025"/><circle cx="18" cy="20" r="6" fill="#7fd1a8"/>
      <text x="32" y="25" font-weight="700" fill="#edeae2">1Password Environment</text>
      <text x="32" y="44" fill="#9a968c">event key mounted as .env, never committed</text>
    </g>
  </g>

  <text x="40" y="735" font-size="13" fill="#9a968c">Green means checked today with a real run or test. Gold means in progress. Outline means planned. Details in the status table below.</text>
</svg>
