<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArgonTwin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="style.css?v=9">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
      }
    }
  </script>
</head>
<body>
  <main class="stage" aria-label="Simulation stage">
    <canvas id="stage"></canvas>

    <header class="masthead">
      <h1>ArgonTwin</h1>
      <p>Two robot arms rehearse a hand-over on Ben's real desk. Argon watches, explains, and fixes the plan.</p>
    </header>

    <div class="status">
      <span id="source" class="source">Connecting</span>
      <button id="closeup" type="button" aria-pressed="false">Gripper view</button>
      <button id="replay" type="button" disabled>Replay</button>
      <button id="edit-plan" type="button" aria-expanded="false" aria-controls="planner" hidden>Edit plan</button>
      <button id="run" type="button" class="primary" hidden>Run the loop</button>
    </div>

    <ol id="phases" class="phases" aria-label="Live run progress" aria-live="polite" hidden></ol>

    <aside id="planner" class="planner" aria-label="Starting plan" hidden>
      <h2>Starting plan</h2>
      <p class="muted" id="planner-base">Loading the base plan</p>
      <fieldset>
        <legend>Handover point (m)</legend>
        <label>x <input id="hp-x" type="number" step="0.01" min="-1.5" max="1.5" inputmode="decimal"></label>
        <label>y <input id="hp-y" type="number" step="0.01" min="-1.5" max="1.5" inputmode="decimal"></label>
        <label>z <input id="hp-z" type="number" step="0.01" min="0" max="0.8" inputmode="decimal"></label>
      </fieldset>
      <label class="single">Lift height (m) <input id="lift" type="number" step="0.01" min="0.03" max="0.4" inputmode="decimal"></label>
      <p id="planner-diff" class="diff"></p>
      <p id="planner-queue" class="queued" hidden></p>
      <p id="planner-error" class="error" role="alert" hidden></p>
      <div class="planner-actions">
        <button id="break-plan" type="button">Break the plan</button>
        <button id="reset-plan" type="button">Reset</button>
        <button id="apply-run" type="button" class="primary">Apply and run</button>
      </div>
    </aside>

    <section id="verdict" class="verdict" aria-live="polite" hidden></section>
    <section id="subtitles" class="subtitles" aria-live="polite" hidden></section>
    <aside id="evidence" class="evidence" hidden></aside>

    <div class="stage-foot">
      <span id="caption"></span>
      <div id="scan-modes" class="scan-modes" role="group" aria-label="View">
        <button type="button" data-mode="gold" aria-pressed="true">Gold</button>
        <button type="button" data-mode="solid" aria-pressed="false">Solid</button>
        <button type="button" data-mode="photo" aria-pressed="false" disabled>Photoreal (not ready)</button>
      </div>
    </div>
  </main>

  <nav class="rail" aria-label="The loop">
    <ol id="steps"></ol>
  </nav>

  <script type="module" src="app.js?v=17"></script>
</body>
</html>
